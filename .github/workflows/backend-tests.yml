name: Backend and frontend checks

on:
  push:
    branches:
      - main
      - feature/full-spec
      - feature/disaster-alert-ingestion
      - feature/multi-agent-assessment
      - feature/geospatial-resource-planning
      - feature/dispatch-simulation
      - feature/alert-intelligence-dashboard
      - feature/reviewed-alert-to-incident
      - feature/automatic-alert-sync
      - feature/resource-inventory-management
      - feature/incident-operations-lifecycle
  pull_request:
    branches:
      - main
      - feature/full-spec
      - feature/disaster-alert-ingestion
      - feature/multi-agent-assessment
      - feature/geospatial-resource-planning
      - feature/dispatch-simulation
      - feature/alert-intelligence-dashboard
      - feature/reviewed-alert-to-incident
      - feature/automatic-alert-sync
      - feature/resource-inventory-management

permissions:
  contents: read

jobs:
  test:
    name: Run backend pytest suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
