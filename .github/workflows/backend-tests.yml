name: Backend tests

on:
  push:
    branches:
      - main
      - feature/disaster-alert-ingestion
      - feature/multi-agent-assessment
      - feature/geospatial-resource-planning
      - feature/dispatch-simulation
      - feature/alert-intelligence-dashboard
      - feature/alert-intelligence-dashboard
      - feature/reviewed-alert-to-incident
  pull_request:
    branches:
      - main
      - feature/disaster-alert-ingestion
      - feature/multi-agent-assessment
      - feature/geospatial-resource-planning
      - feature/dispatch-simulation

permissions:
  contents: read

jobs:
  test:
    name: Run backend pytest suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -q
